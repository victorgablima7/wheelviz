name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v2
      - name: Build
        run: |
          mkdir -p app/src/main/assets/www
          cp www/index.html app/src/main/assets/www/
          mkdir -p gradle/wrapper
          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          cat > build.gradle << 'EOF'
buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.1.0' } }
allprojects { repositories { google(); mavenCentral() } }
EOF
          cat > settings.gradle << 'EOF'
rootProject.name = 'WHEELVIZ'; include ':app'
EOF
          cat > gradle.properties << 'EOF'
org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/AndroidManifest.xml << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.wheelviz.app">
<application android:allowBackup="true" android:label="WHEELVIZ">
<activity android:launchMode="singleTask"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
</application>
</manifest>
EOF
          cat > app/src/main/res/values/strings.xml << 'EOF'
<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">WHEELVIZ</string></resources>
EOF
          cat > app/build.gradle << 'EOF'
plugins { id 'com.android.application' }
android { namespace 'com.wheelviz.app'; compileSdk 34; defaultConfig { applicationId "com.wheelviz.app"; minSdk 22; targetSdk 34 } }
dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
EOF
          curl -sL https://services.gradle.org/distributions/gradle-8.4-bin.zip -o gradle.zip && unzip -q gradle.zip && mv gradle-8.4/gradlew . && chmod +x gradlew && rm -rf gradle.zip gradle-8.4
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: WHEELVIZ-APK
          path: app/build/outputs/apk/debug/app-debug.apk
