name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      
      - name: Install Cordova
        run: npm install -g cordova
      
      - name: Create Cordova project
        run: cordova create WheelVizApp com.wheelviz.app WHEELVIZ
      
      - name: Copy app files
        run: |
          cp www/index.html WheelVizApp/www/
          cp -r www/res WheelVizApp/www/
          cp config.xml WheelVizApp/
      
      - name: Add Android
        run: cd WheelVizApp && cordova platform add android
      
      - name: Build APK
        run: cd WheelVizApp && cordova build android
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WHEELVIZ-APK
          path: WheelVizApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
